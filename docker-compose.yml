services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Fadak_Strong_Passw0rd!"
    ports:
      - "1433:1433"
    volumes:
      - sql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Fadak_Strong_Passw0rd!' -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  payment-service:
    build:
      context: .
      dockerfile: src/PaymentService/PaymentService.Api/Dockerfile
    environment:
      ASPNETCORE_URLS: "http://+:8080"
      ConnectionStrings__PaymentDatabase: "Server=sqlserver,1433;Database=FadakPayments;User Id=sa;Password=Fadak_Strong_Passw0rd!;Encrypt=True;TrustServerCertificate=True;MultipleActiveResultSets=True"
      Gateway__BaseUrl: "http://gateway-service:8080"
      RabbitMq__HostName: "rabbitmq"
    ports:
      - "5001:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  gateway-service:
    build:
      context: .
      dockerfile: src/GatewayService/GatewayService.Api/Dockerfile
    environment:
      ASPNETCORE_URLS: "http://+:8080"
      PaymentService__BaseUrl: "http://payment-service:8080"
      ConnectionStrings__GatewayDatabase: "Server=sqlserver,1433;Database=FadakGateway;User Id=sa;Password=Fadak_Strong_Passw0rd!;Encrypt=True;TrustServerCertificate=True;MultipleActiveResultSets=True"
    ports:
      - "5002:8080"
    depends_on:
      payment-service:
        condition: service_started
      sqlserver:
        condition: service_healthy

  notification-service:
    build:
      context: .
      dockerfile: src/NotificationService/NotificationService.Api/Dockerfile
    environment:
      ASPNETCORE_URLS: "http://+:8080"
      RabbitMq__HostName: "rabbitmq"
      ConnectionStrings__NotificationDatabase: "Server=sqlserver,1433;Database=FadakNotifications;User Id=sa;Password=Fadak_Strong_Passw0rd!;Encrypt=True;TrustServerCertificate=True;MultipleActiveResultSets=True"
    ports:
      - "5003:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

volumes:
  sql-data:
